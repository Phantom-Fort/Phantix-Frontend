<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F8F9FB"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">The Setup Around the Model Is the Target</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5A6579">Content the agent reads becomes instructions it follows, and the tools it holds decide the damage</text>

  <rect x="250" y="100" width="400" height="68" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="276" cy="134" r="12" fill="#1E40AF"/>
  <text x="276" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="300" y="130" font-size="13.5" font-weight="600" fill="#1E293B">Malicious content arrives</text>
  <text x="300" y="150" font-size="11.5" fill="#5A6579">inside something the agent is asked to read</text>

  <line x1="450" y1="168" x2="450" y2="192" stroke="#41506B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="250" y="196" width="400" height="68" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="276" cy="230" r="12" fill="#92400E"/>
  <text x="276" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="300" y="226" font-size="13.5" font-weight="600" fill="#92400E">Hidden instructions sit inside it</text>
  <text x="300" y="246" font-size="11.5" fill="#78350F">the line between text and commands blurs</text>

  <line x1="450" y1="264" x2="450" y2="288" stroke="#41506B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="250" y="292" width="400" height="68" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="276" cy="326" r="12" fill="#1E40AF"/>
  <text x="276" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="300" y="322" font-size="13.5" font-weight="600" fill="#1E40AF">The agent treats them as the task</text>
  <text x="300" y="342" font-size="11.5" fill="#1E293B">this trick is prompt injection</text>

  <line x1="450" y1="360" x2="255" y2="392" stroke="#41506B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="360" x2="645" y2="392" stroke="#41506B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="60" y="396" width="370" height="64" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="245" y="434" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991B1B">Harmful commands run</text>

  <rect x="470" y="396" width="370" height="64" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="434" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991B1B">Company data leaves quietly</text>

  <rect x="60" y="486" width="780" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="510" font-size="12" fill="#1E293B">A hidden description inside a pull request was enough to make a coding assistant run harmful commands.</text>
  <text x="80" y="530" font-size="12" fill="#1E293B">A hidden instruction inside a document leaked company data with no user clicking anything.</text>
</svg>
