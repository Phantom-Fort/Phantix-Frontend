<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#F8F9FB"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">A Checkpoint and a Cycle</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5A6579">Security as a point-in-time gate, against how modern delivery actually runs</text>

  <text x="60" y="104" font-size="13" font-weight="700" fill="#5A6579">Security as a checkpoint</text>

  <rect x="60" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134" y="155" text-anchor="middle" font-size="12.5" fill="#1E293B">Build</text>

  <line x1="210" y1="148" x2="220" y2="148" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="224" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="155" text-anchor="middle" font-size="12.5" fill="#1E293B">Test</text>

  <line x1="374" y1="148" x2="384" y2="148" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="388" y="120" width="148" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="462" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Security assessment</text>

  <line x1="538" y1="148" x2="548" y2="148" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="552" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="626" y="155" text-anchor="middle" font-size="12.5" fill="#1E293B">Fix</text>

  <line x1="702" y1="148" x2="712" y2="148" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="716" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="155" text-anchor="middle" font-size="12.5" fill="#1E293B">Deploy</text>

  <text x="60" y="200" font-size="12" fill="#5A6579">A point in time: the report describes the application on the day it was tested.</text>

  <text x="60" y="244" font-size="13" font-weight="700" fill="#1E40AF">How modern delivery actually runs</text>

  <rect x="60" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134" y="295" text-anchor="middle" font-size="12.5" fill="#1E293B">Build</text>

  <line x1="210" y1="288" x2="220" y2="288" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="224" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="295" text-anchor="middle" font-size="12.5" fill="#1E293B">Test</text>

  <line x1="374" y1="288" x2="384" y2="288" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="388" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="462" y="295" text-anchor="middle" font-size="12.5" fill="#1E293B">Deploy</text>

  <line x1="538" y1="288" x2="548" y2="288" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="552" y="260" width="148" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="626" y="295" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E40AF">Change</text>

  <line x1="702" y1="288" x2="712" y2="288" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="716" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="295" text-anchor="middle" font-size="12.5" fill="#1E293B">Deploy</text>

  <path d="M790 316 L790 344 L626 344 L626 320" fill="none" stroke="#41506B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="700" y="366" text-anchor="middle" font-size="11.5" fill="#5A6579">and the cycle continues</text>

  <rect x="60" y="386" width="780" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="416" font-size="13" font-weight="600" fill="#1E293B">Software changes continuously, so security needs to continuously validate those changes.</text>
  <text x="80" y="442" font-size="12" fill="#5A6579">The difference is more than a change in workflow. It is a change in mindset.</text>
</svg>
