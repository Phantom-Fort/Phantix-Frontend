<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#F8F9FB"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">What a Point-in-Time Assessment Cannot See</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5A6579">The report stays true to the day it was written while the application keeps moving</text>

  <rect x="60" y="110" width="300" height="120" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="138" font-size="13" font-weight="700" fill="#1E40AF">January</text>
  <text x="80" y="164" font-size="12" fill="#1E293B">Penetration test run.</text>
  <text x="80" y="184" font-size="12" fill="#1E293B">Vulnerabilities fixed.</text>
  <text x="80" y="204" font-size="12" fill="#1E293B">Report produced.</text>

  <line x1="210" y1="230" x2="210" y2="262" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="540" y="110" width="300" height="160" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="138" font-size="13" font-weight="700" fill="#92400E">March — the same application</text>
  <text x="560" y="164" font-size="12" fill="#78350F">New features shipped.</text>
  <text x="560" y="186" font-size="12" fill="#78350F">External API integrated.</text>
  <text x="560" y="208" font-size="12" fill="#78350F">Dependencies updated.</text>
  <text x="560" y="230" font-size="12" fill="#78350F">Authentication logic changed.</text>
  <text x="560" y="252" font-size="12" fill="#78350F">Cloud configuration modified.</text>

  <line x1="690" y1="270" x2="690" y2="262" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <line x1="90" y1="268" x2="830" y2="268" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="210" cy="268" r="6" fill="#1E40AF"/>
  <circle cx="690" cy="268" r="6" fill="#D97706"/>

  <line x1="216" y1="300" x2="684" y2="300" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="450" y="292" text-anchor="middle" font-size="11.5" fill="#92400E">change accumulates between assessments</text>

  <rect x="60" y="330" width="780" height="76" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="358" font-size="12.5" fill="#1E293B">The assessment remains useful as a record of what was true in January.</text>
  <text x="80" y="380" font-size="12.5" fill="#1E293B">It does not tell you what the security state looks like today, because the application changed.</text>
</svg>
