<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>
  <rect width="820" height="620" fill="#F8F9FB"/>
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">The CIBC Framework — Six Layers</text>
  <text x="410" y="60" text-anchor="middle" font-size="12.5" fill="#5A6579">Context-Aware, Intent-Bound Capability Control</text>

  <!-- layer boxes -->
  <g font-size="13.5">
    <rect x="140" y="82" width="540" height="66" rx="10" fill="#EFF3F8" stroke="#2D5F8A" stroke-width="1.8"/>
    <text x="160" y="108" font-weight="700" fill="#2D5F8A" font-size="13">1. Identity Layer</text>
    <text x="160" y="128" fill="#3D4658" font-size="11.5">Human / Organization / Agent / Run</text>

    <line x1="410" y1="148" x2="410" y2="170" stroke="#41506B" stroke-width="1.5" marker-end="url(#arr5)"/>

    <rect x="140" y="170" width="540" height="66" rx="10" fill="#FFFFFF" stroke="#375A78" stroke-width="1.8"/>
    <text x="160" y="196" font-weight="700" fill="#375A78" font-size="13">2. Delegation Layer</text>
    <text x="160" y="216" fill="#3D4658" font-size="11.5">Who authorized whom?</text>

    <line x1="410" y1="236" x2="410" y2="258" stroke="#41506B" stroke-width="1.5" marker-end="url(#arr5)"/>

    <rect x="140" y="258" width="540" height="66" rx="10" fill="#FBF4EA" stroke="#8A5A2D" stroke-width="1.8"/>
    <text x="160" y="284" font-weight="700" fill="#8A5A2D" font-size="13">3. Objective Layer</text>
    <text x="160" y="304" fill="#3D4658" font-size="11.5">What authorized purpose exists?</text>

    <line x1="410" y1="324" x2="410" y2="346" stroke="#41506B" stroke-width="1.5" marker-end="url(#arr5)"/>

    <rect x="140" y="346" width="540" height="66" rx="10" fill="#FDEFEF" stroke="#B23A48" stroke-width="1.8"/>
    <text x="160" y="372" font-weight="700" fill="#B23A48" font-size="13">4. Context Trust Layer</text>
    <text x="160" y="392" fill="#3D4658" font-size="11.5">What information influenced the action?</text>

    <line x1="410" y1="412" x2="410" y2="434" stroke="#41506B" stroke-width="1.5" marker-end="url(#arr5)"/>

    <rect x="140" y="434" width="540" height="66" rx="10" fill="#EEF6F1" stroke="#3F7D5C" stroke-width="1.8"/>
    <text x="160" y="460" font-weight="700" fill="#3F7D5C" font-size="13">5. Capability Layer</text>
    <text x="160" y="480" fill="#3D4658" font-size="11.5">What narrow authority is required?</text>

    <line x1="410" y1="500" x2="410" y2="522" stroke="#41506B" stroke-width="1.5" marker-end="url(#arr5)"/>

    <rect x="140" y="522" width="540" height="66" rx="10" fill="#1A2333" stroke="#1A2333" stroke-width="1.8"/>
    <text x="160" y="548" font-weight="700" fill="#FFFFFF" font-size="13">6. Enforcement &amp; Evidence Layer</text>
    <text x="160" y="568" fill="#C6CCDA" font-size="11.5">Allow / Deny / Step-up / Record</text>
  </g>
</svg>
