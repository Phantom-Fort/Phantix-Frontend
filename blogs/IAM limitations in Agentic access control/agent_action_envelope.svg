<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6579"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#F8F9FB"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">The Agent Action Envelope (AAE)</text>
  <text x="450" y="60" text-anchor="middle" font-size="12.5" fill="#5A6579">The bundle of information required to evaluate a meaningful agent action</text>

  <!-- central envelope box -->
  <rect x="330" y="90" width="240" height="56" rx="10" fill="#1A2333"/>
  <text x="450" y="124" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Agent Action Envelope</text>

  <!-- 8 child nodes in a grid, each connected up to the envelope -->
  <g font-size="12.8">
    <!-- row 1 -->
    <line x1="450" y1="146" x2="120" y2="200" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="30" y="200" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#2D5F8A" stroke-width="1.6"/>
    <text x="120" y="222" text-anchor="middle" font-weight="700" fill="#2D5F8A">Principal</text>
    <text x="120" y="240" text-anchor="middle" fill="#5A6579" font-size="11">Who ultimately owns the authority</text>

    <line x1="450" y1="146" x2="330" y2="200" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="240" y="200" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#2D5F8A" stroke-width="1.6"/>
    <text x="330" y="222" text-anchor="middle" font-weight="700" fill="#2D5F8A">Agent</text>
    <text x="330" y="240" text-anchor="middle" fill="#5A6579" font-size="11">Which persistent agent is acting</text>

    <line x1="450" y1="146" x2="570" y2="200" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="480" y="200" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#2D5F8A" stroke-width="1.6"/>
    <text x="570" y="222" text-anchor="middle" font-weight="700" fill="#2D5F8A">Agent Run</text>
    <text x="570" y="240" text-anchor="middle" fill="#5A6579" font-size="11">Which execution requests authority</text>

    <line x1="450" y1="146" x2="780" y2="200" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="690" y="200" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#2D5F8A" stroke-width="1.6"/>
    <text x="780" y="222" text-anchor="middle" font-weight="700" fill="#2D5F8A">Delegation Chain</text>
    <text x="780" y="240" text-anchor="middle" fill="#5A6579" font-size="11">How authority reached this run</text>

    <!-- row 2 -->
    <line x1="450" y1="146" x2="120" y2="330" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="30" y="330" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#8A5A2D" stroke-width="1.6"/>
    <text x="120" y="352" text-anchor="middle" font-weight="700" fill="#8A5A2D">Authorized Objective</text>
    <text x="120" y="370" text-anchor="middle" fill="#5A6579" font-size="11">The approved purpose</text>

    <line x1="450" y1="146" x2="330" y2="330" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="240" y="330" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#8A5A2D" stroke-width="1.6"/>
    <text x="330" y="352" text-anchor="middle" font-weight="700" fill="#8A5A2D">Context Provenance</text>
    <text x="330" y="370" text-anchor="middle" fill="#5A6579" font-size="11">What influenced the action</text>

    <line x1="450" y1="146" x2="570" y2="330" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="480" y="330" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#8A5A2D" stroke-width="1.6"/>
    <text x="570" y="352" text-anchor="middle" font-weight="700" fill="#8A5A2D">Requested Capability</text>
    <text x="570" y="370" text-anchor="middle" fill="#5A6579" font-size="11">The exact authority required</text>

    <line x1="450" y1="146" x2="780" y2="330" stroke="#B7C0D1" stroke-width="1.4" marker-end="url(#arr2)"/>
    <rect x="690" y="330" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#8A5A2D" stroke-width="1.6"/>
    <text x="780" y="352" text-anchor="middle" font-weight="700" fill="#8A5A2D">Constraints</text>
    <text x="780" y="370" text-anchor="middle" fill="#5A6579" font-size="11">TTL, uses, scope, approval</text>
  </g>

  <!-- evidence bar spanning bottom -->
  <line x1="120" y1="382" x2="120" y2="470" stroke="#B7C0D1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="330" y1="382" x2="330" y2="470" stroke="#B7C0D1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="570" y1="382" x2="570" y2="470" stroke="#B7C0D1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="780" y1="382" x2="780" y2="470" stroke="#B7C0D1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="30" y="470" width="840" height="60" rx="10" fill="#EFF3F8" stroke="#3F7D5C" stroke-width="1.8"/>
  <text x="450" y="495" text-anchor="middle" font-weight="700" fill="#3F7D5C" font-size="13.5">Evidence</text>
  <text x="450" y="516" text-anchor="middle" fill="#3D4658" font-size="12">A verifiable, auditable record demonstrating why the action was authorized</text>

  <text x="450" y="570" text-anchor="middle" font-size="12" fill="#5A6579" font-style="italic">Every field of the envelope must hold before an action is authorized — the envelope, not the identity alone, is the unit of authorization.</text>
</svg>
