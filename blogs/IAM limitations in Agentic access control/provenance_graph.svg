<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="200" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Delegation / Provenance Graph</text>
  
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <rect x="75" y="45" width="250" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="71" text-anchor="middle" font-weight="600" fill="#1e40af">Human Request</text>
    <line x1="200" y1="87" x2="200" y2="105" stroke="#64748b" stroke-width="2"/>
    <polygon points="200,112 194,102 206,102" fill="#64748b"/>
    
    <rect x="75" y="112" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="138" text-anchor="middle" fill="#1e293b">Agent Objective</text>
    <line x1="200" y1="154" x2="200" y2="172" stroke="#64748b" stroke-width="2"/>
    <polygon points="200,179 194,169 206,169" fill="#64748b"/>
    
    <rect x="75" y="179" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="205" text-anchor="middle" fill="#1e293b">Retrieved Evidence</text>
    <line x1="200" y1="221" x2="200" y2="239" stroke="#64748b" stroke-width="2"/>
    <polygon points="200,246 194,236 206,236" fill="#64748b"/>
    
    <rect x="75" y="246" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="272" text-anchor="middle" fill="#1e293b">Threat Intelligence Query</text>
    <line x1="200" y1="288" x2="200" y2="306" stroke="#64748b" stroke-width="2"/>
    <polygon points="200,313 194,303 206,303" fill="#64748b"/>
    
    <rect x="75" y="313" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="339" text-anchor="middle" fill="#1e293b">Agent Decision</text>
    <line x1="200" y1="355" x2="200" y2="373" stroke="#64748b" stroke-width="2"/>
    <polygon points="200,380 194,370 206,370" fill="#64748b"/>
    
    <rect x="75" y="380" width="250" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="406" text-anchor="middle" font-weight="600" fill="#92400e">Requested Tool Action</text>
  </g>
</svg>
