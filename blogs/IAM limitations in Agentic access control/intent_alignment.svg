<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="180" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Intent Alignment Evaluation</text>
  
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <rect x="55" y="45" width="250" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="180" y="71" text-anchor="middle" font-weight="600" fill="#1e40af">Objective</text>
    <line x1="180" y1="87" x2="180" y2="105" stroke="#64748b" stroke-width="2"/>
    <polygon points="180,112 174,102 186,102" fill="#64748b"/>
    
    <rect x="55" y="112" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="180" y="138" text-anchor="middle" fill="#1e293b">Authorized Action Classes</text>
    <line x1="180" y1="154" x2="180" y2="172" stroke="#64748b" stroke-width="2"/>
    <polygon points="180,179 174,169 186,169" fill="#64748b"/>
    
    <rect x="55" y="179" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="180" y="205" text-anchor="middle" fill="#1e293b">Target Scope</text>
    <line x1="180" y1="221" x2="180" y2="239" stroke="#64748b" stroke-width="2"/>
    <polygon points="180,246 174,236 186,236" fill="#64748b"/>
    
    <rect x="55" y="246" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="180" y="272" text-anchor="middle" fill="#1e293b">Constraints</text>
    <line x1="180" y1="288" x2="180" y2="306" stroke="#64748b" stroke-width="2"/>
    <polygon points="180,313 174,303 186,303" fill="#64748b"/>
    
    <rect x="55" y="313" width="250" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="180" y="339" text-anchor="middle" font-weight="600" fill="#166534">Requested Capability</text>
  </g>
</svg>
