<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#F8F9FB"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">Useful Automation Inside Controlled Boundaries</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5A6579">Least privilege, an approval gate, and a record of what actually happened</text>

  <rect x="250" y="96" width="400" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="450" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Authorized scope</text>

  <rect x="330" y="140" width="240" height="72" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">Security agent</text>
  <text x="450" y="192" text-anchor="middle" font-size="11.5" fill="#1E293B">discovers, tests, explains</text>

  <line x1="652" y1="171" x2="676" y2="171" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="680" y="147" width="170" height="48" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="765" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991B1B">Outside the scope</text>
  <text x="765" y="185" text-anchor="middle" font-size="11.5" fill="#991B1B">blocked, not attempted</text>

  <path d="M450 246 L450 266" fill="none" stroke="#41506B" stroke-width="1.6"/>
  <line x1="180" y1="266" x2="720" y2="266" stroke="#41506B" stroke-width="1.6"/>
  <line x1="180" y1="266" x2="180" y2="284" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="266" x2="450" y2="284" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="266" x2="720" y2="284" stroke="#41506B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="60" y="290" width="240" height="116" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="320" font-size="13" font-weight="700" fill="#1E40AF">Least privilege</text>
  <text x="80" y="348" font-size="11.5" fill="#1E293B">Only the permissions the task</text>
  <text x="80" y="368" font-size="11.5" fill="#1E293B">needs. Nothing more.</text>

  <rect x="330" y="290" width="240" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="320" font-size="13" font-weight="700" fill="#92400E">Human approval</text>
  <text x="350" y="348" font-size="11.5" fill="#78350F">High-impact or destructive</text>
  <text x="350" y="368" font-size="11.5" fill="#78350F">actions can require approval.</text>

  <rect x="600" y="290" width="240" height="116" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="320" font-size="13" font-weight="700" fill="#166534">Audit trail</text>
  <text x="620" y="348" font-size="11.5" fill="#14532D">Who did what, and when, so</text>
  <text x="620" y="368" font-size="11.5" fill="#14532D">the automation can be checked.</text>

  <rect x="60" y="426" width="780" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="451" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E293B">The goal is not unlimited autonomy. It is useful automation within controlled boundaries.</text>
</svg>
