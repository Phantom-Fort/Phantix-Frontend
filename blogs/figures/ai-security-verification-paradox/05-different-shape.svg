<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#F8F9FB"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">Not a Cheaper Copy, a Different Shape</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5A6579">What traditional security pricing assumes, and what small businesses can actually buy</text>

  <text x="250" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#5A6579">The enterprise shape</text>
  <rect x="60" y="118" width="380" height="290" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="80" y="140" width="340" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="170" text-anchor="middle" font-size="12.5" fill="#334155">Full-time security staff</text>

  <rect x="80" y="202" width="340" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="232" text-anchor="middle" font-size="12.5" fill="#334155">Constant monitoring</text>

  <rect x="80" y="264" width="340" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="294" text-anchor="middle" font-size="12.5" fill="#334155">Expensive compliance tools</text>

  <rect x="80" y="326" width="340" height="76" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="250" y="356" text-anchor="middle" font-size="12.5" fill="#334155">Priced for companies that already</text>
  <text x="250" y="376" text-anchor="middle" font-size="12.5" fill="#334155">have a security team in place</text>

  <text x="650" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">A different shape</text>
  <rect x="460" y="118" width="380" height="290" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>

  <rect x="480" y="140" width="340" height="50" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="170" text-anchor="middle" font-size="12.5" fill="#1E293B">Shared infrastructure</text>

  <rect x="480" y="202" width="340" height="50" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="232" text-anchor="middle" font-size="12.5" fill="#1E293B">AI doing the automatic first pass</text>

  <rect x="480" y="264" width="340" height="50" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="294" text-anchor="middle" font-size="12.5" fill="#1E293B">Human experts for the hard problems</text>

  <rect x="480" y="326" width="340" height="76" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Priced in tens of dollars a month,</text>
  <text x="650" y="376" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">not thousands</text>

  <rect x="60" y="428" width="780" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="453" text-anchor="middle" font-size="12.5" fill="#1E293B">The promising answers in the region are genuinely different setups, not smaller versions of enterprise tools.</text>
</svg>
