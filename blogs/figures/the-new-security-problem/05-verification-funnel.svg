<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41506B"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#F8F9FB"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A2333">From a Finding to a Verified Finding</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5A6579">Discovery is the start. Validation and evidence are what make a finding usable</text>

  <rect x="140" y="110" width="620" height="50" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="141" text-anchor="middle" font-size="13" fill="#1E293B">Potential findings from automated tools</text>

  <text x="450" y="181" text-anchor="middle" font-size="12" fill="#5A6579">Can it be reproduced?</text>
  <rect x="88" y="162" width="96" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="136" y="181" text-anchor="middle" font-size="11" fill="#991B1B">false positive</text>
  <line x1="210" y1="164" x2="210" y2="188" stroke="#41506B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="192" width="520" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="223" text-anchor="middle" font-size="13" fill="#1E40AF">Reproduced</text>

  <text x="450" y="263" text-anchor="middle" font-size="12" fill="#5A6579">Is the input actually reaching a vulnerable query?</text>
  <rect x="88" y="244" width="96" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="136" y="263" text-anchor="middle" font-size="11" fill="#991B1B">not reachable</text>
  <line x1="210" y1="246" x2="210" y2="270" stroke="#41506B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="274" width="420" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#1E40AF">Exploitable and understood</text>

  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#5A6579">What is the potential impact?</text>
  <rect x="88" y="326" width="96" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="136" y="345" text-anchor="middle" font-size="11" fill="#991B1B">no real impact</text>
  <line x1="210" y1="328" x2="210" y2="352" stroke="#41506B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="356" width="320" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="387" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Verified finding with evidence</text>

  <rect x="60" y="430" width="780" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="454" font-size="12" fill="#1E293B">Generating thousands of findings without validation does not remove the problem, it swaps it:</text>
  <text x="80" y="474" font-size="12" fill="#1E293B">teams overwhelmed by alerts instead of by vulnerabilities.</text>
</svg>
