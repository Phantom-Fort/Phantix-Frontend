<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="210" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">AI Agent Dynamic Action Path</text>
  
  <!-- Boxes and arrows -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <!-- 1 -->
    <rect x="85" y="45" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="71" text-anchor="middle" fill="#1e293b">Receive objective</text>
    <line x1="210" y1="87" x2="210" y2="105" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,112 204,102 216,102" fill="#64748b"/>
    
    <!-- 2 -->
    <rect x="85" y="112" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="138" text-anchor="middle" fill="#1e293b">Retrieve logs</text>
    <line x1="210" y1="154" x2="210" y2="172" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,179 204,169 216,169" fill="#64748b"/>
    
    <!-- 3 -->
    <rect x="85" y="179" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="205" text-anchor="middle" fill="#1e293b">Read documentation</text>
    <line x1="210" y1="221" x2="210" y2="239" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,246 204,236 216,236" fill="#64748b"/>
    
    <!-- 4 -->
    <rect x="85" y="246" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="272" text-anchor="middle" fill="#1e293b">Query threat intelligence</text>
    <line x1="210" y1="288" x2="210" y2="306" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,313 204,303 216,303" fill="#64748b"/>
    
    <!-- 5 -->
    <rect x="85" y="313" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="339" text-anchor="middle" fill="#1e293b">Interpret evidence</text>
    <line x1="210" y1="355" x2="210" y2="373" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,380 204,370 216,370" fill="#64748b"/>
    
    <!-- 6 -->
    <rect x="85" y="380" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="406" text-anchor="middle" fill="#1e293b">Select one or more tools</text>
    <line x1="210" y1="422" x2="210" y2="440" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,447 204,437 216,437" fill="#64748b"/>
    
    <!-- 7 -->
    <rect x="85" y="447" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="473" text-anchor="middle" fill="#1e293b">Generate parameters</text>
    <line x1="210" y1="489" x2="210" y2="507" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,514 204,504 216,504" fill="#64748b"/>
    
    <!-- 8 -->
    <rect x="85" y="514" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="540" text-anchor="middle" fill="#1e293b">Evaluate intermediate results</text>
    <line x1="210" y1="556" x2="210" y2="574" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,581 204,571 216,571" fill="#64748b"/>
    
    <!-- 9 -->
    <rect x="85" y="581" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="607" text-anchor="middle" fill="#1e293b">Modify its plan</text>
    <line x1="210" y1="623" x2="210" y2="641" stroke="#64748b" stroke-width="2"/>
    <polygon points="210,648 204,638 216,638" fill="#64748b"/>
    
    <!-- 10 -->
    <rect x="85" y="648" width="250" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="674" text-anchor="middle" font-weight="600" fill="#1e40af">Take action</text>
  </g>
</svg>
