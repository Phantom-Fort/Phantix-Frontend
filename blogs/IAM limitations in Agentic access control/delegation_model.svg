<svg xmlns="http://www.w3.org/2000/svg" width="320" height="380" viewBox="0 0 320 380">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="160" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Delegation Model</text>
  
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <rect x="50" y="45" width="220" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="71" text-anchor="middle" font-weight="600" fill="#1e40af">Human</text>
    <line x1="160" y1="87" x2="160" y2="105" stroke="#64748b" stroke-width="2"/>
    <polygon points="160,112 154,102 166,102" fill="#64748b"/>
    
    <rect x="50" y="112" width="220" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="138" text-anchor="middle" fill="#1e293b">Agent</text>
    <line x1="160" y1="154" x2="160" y2="172" stroke="#64748b" stroke-width="2"/>
    <polygon points="160,179 154,169 166,169" fill="#64748b"/>
    
    <rect x="50" y="179" width="220" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="205" text-anchor="middle" fill="#1e293b">Agent Run</text>
    <line x1="160" y1="221" x2="160" y2="239" stroke="#64748b" stroke-width="2"/>
    <polygon points="160,246 154,236 166,236" fill="#64748b"/>
    
    <rect x="50" y="246" width="220" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="272" text-anchor="middle" fill="#1e293b">Sub-Agent</text>
    <line x1="160" y1="288" x2="160" y2="306" stroke="#64748b" stroke-width="2"/>
    <polygon points="160,313 154,303 166,303" fill="#64748b"/>
    
    <rect x="50" y="313" width="220" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="339" text-anchor="middle" font-weight="600" fill="#92400e">Tool</text>
  </g>
</svg>
